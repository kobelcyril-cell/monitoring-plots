<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero-difference GNSS Processing</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
            background-color: #121212;
            color: #e0e0e0;
        }

        h1, h2 {
            text-align: center;
            color: #ffffff;
        }

        .meta {
            text-align: center;
            font-size: 0.9em;
            color: #bbbbbb;
            margin-bottom: 35px;
        }

        .plots-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .plot {
            background-color: #1e1e1e;
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }

        .plot img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .plot .updated {
            margin-top: 8px;
            font-size: 0.8em;
            color: #aaaaaa;
            text-align: right;
        }
    </style>
</head>

<body>

<h1>Zero-difference GNSS Processing</h1>

<div class="meta">
    Created by Cyril Kobel<br>
    Astronomical Institute, University of Bern<br>
    Page loaded: <span id="page-time"></span>
</div>

<h2>Latest Plots</h2>
<div id="latest-container" class="plots-container"></div>

<h2>Comparison Plots</h2>
<div id="comparisons-container" class="plots-container"></div>

<script src="plots_list.js"></script>
<script src="comparisons_list.js"></script>

<script>
function renderPlots(containerId, plotsArray, folder) {
    const container = document.getElementById(containerId);
    plotsArray.forEach(filename => {
        const plotDiv = document.createElement("div");
        plotDiv.className = "plot";

        const img = document.createElement("img");
        const imgPath = folder + "/" + filename;
        img.src = imgPath + "?ts=" + new Date().getTime();
        img.alt = "";
        plotDiv.appendChild(img);

        const updated = document.createElement("div");
        updated.className = "updated";
        updated.textContent = "Last updated: …";
        plotDiv.appendChild(updated);

        container.appendChild(plotDiv);

        // Last-Modified via HEAD request
        fetch(imgPath, { method: "HEAD" })
            .then(response => {
                const lm = response.headers.get("Last-Modified");
                if (lm) {
                    updated.textContent = "Last updated: " + new Date(lm).toLocaleString();
                } else {
                    updated.textContent = "Last updated: unknown";
                }
            })
            .catch(() => {
                updated.textContent = "Last updated: unavailable";
            });
    });
}

renderPlots("latest-container", latest_plots, "plots/latest");
renderPlots("comparisons-container", comparison_plots, "plots/comparisons");

document.getElementById("page-time").innerText = new Date().toLocaleString();
</script>

</body>
</html>
