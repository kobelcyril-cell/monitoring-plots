<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zero-difference GNSS Processing</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 30px;
    background-color: #121212;
    color: #e0e0e0;
}

h1, h2 {
    text-align: center;
    color: #ffffff;
}

.meta {
    text-align: center;
    font-size: 0.9em;
    color: #bbbbbb;
    margin-bottom: 35px;
}

/* ---------- PLOTS ---------- */
.plots-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 25px;
    margin-bottom: 50px;
}

.plot {
    background-color: #1e1e1e;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
}

.plot img {
    width: 100%;
    border-radius: 8px;
}

.plot .updated {
    margin-top: 8px;
    font-size: 0.8em;
    color: #aaaaaa;
    text-align: right;
}

/* ---------- MONITOR ---------- */
#monitor-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.process-card {
    width: 360px;
    background: #1e1e1e;
    padding: 14px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
}

.progress-bar-container {
    background: #333;
    border-radius: 6px;
    overflow: hidden;
    height: 16px;
    margin-top: 6px;
}

.progress-bar {
    height: 100%;
    transition: width 0.4s ease;
}

/* Animation nur für running */
.progress-running {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { opacity: 0.6; }
    50% { opacity: 1.0; }
    100% { opacity: 0.6; }
}

.task-list {
    max-height: 120px;
    overflow-y: auto;
    margin: 6px 0 0 0;
    padding-left: 20px;
}

.task-running  { color: orange; }
.task-waiting  { color: gray; }
.task-finished { color: #4caf50; }
.task-error    { color: red; }
</style>
</head>

<body>

<h1>Zero-difference GNSS Processing</h1>

<div class="meta">
    Created by Cyril Kobel<br>
    Astronomical Institute, University of Bern<br>
    Page loaded: <span id="page-time"></span>
</div>

<h2>Latest Plots</h2>
<div id="latest-container" class="plots-container"></div>

<h2>Comparison Plots</h2>
<div id="comparisons-container" class="plots-container"></div>

<h2>Live Process Monitor</h2>
<div id="monitor-container"></div>

<script src="plots_list.js"></script>
<script src="comparisons_list.js"></script>

<script>
function renderPlots(containerId, plotsArray, folder) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    plotsArray.forEach(fn => {
        const d = document.createElement("div");
        d.className = "plot";

        const img = document.createElement("img");
        img.src = folder + "/" + fn + "?ts=" + Date.now();
        d.appendChild(img);

        const u = document.createElement("div");
        u.className = "updated";
        u.textContent = "Last updated: …";
        d.appendChild(u);

        fetch(folder + "/" + fn, {method:"HEAD"})
            .then(r => {
                const lm = r.headers.get("Last-Modified");
                u.textContent = lm
                    ? "Last updated: " + new Date(lm).toLocaleString()
                    : "Last updated: unknown";
            });

        container.appendChild(d);
    });
}

renderPlots("latest-container", latest_plots, "plots/latest");
renderPlots("comparisons-container", comparison_plots, "plots/comparisons");

document.getElementById("page-time").innerText = new Date().toLocaleString();
</script>

<script>
async function updateMonitor() {
    const container = document.getElementById("monitor-container");
    container.innerHTML = "";

    try {
        const resp = await fetch("status.json?ts=" + Date.now());
        const data = await resp.json();

        for (const [proc, sessions] of Object.entries(data)) {
            if (proc === "updated") continue;

            const card = document.createElement("div");
            card.className = "process-card";

            const h3 = document.createElement("h3");
            h3.textContent = proc;
            card.appendChild(h3);

            sessions.forEach(session => {
                const sdiv = document.createElement("div");
                sdiv.style.marginBottom = "14px";

                const tasks = session.tasks || [];

                const hasRunning = tasks.some(t => t.status === "running");
                const hasWaiting = tasks.some(t => t.status === "waiting");
                const hasError   = tasks.some(t => t.status === "error");

                let sessionStatus = "finished";
                if (hasError || session.status === "error") sessionStatus = "error";
                else if (hasRunning) sessionStatus = "running";
                else if (hasWaiting) sessionStatus = "waiting";
                else if (session.status === "missing") sessionStatus = "missing";

                const title = document.createElement("div");
                title.innerHTML = `<strong>Session ${session.session_id}:</strong> ${sessionStatus}`;
                sdiv.appendChild(title);

                /* Progress bar */
                const pbc = document.createElement("div");
                pbc.className = "progress-bar-container";

                const pb = document.createElement("div");
                pb.className = "progress-bar";

                let color = "gray";

                if (sessionStatus === "running") {
                    color = "orange";
                    pb.classList.add("progress-running");
                    pb.style.width = Math.max(session.progress ?? 0, 15) + "%";
                } else if (sessionStatus === "finished") {
                    color = "#4caf50";
                    pb.style.width = "100%";
                } else if (sessionStatus === "missing") {
                    color = "yellow";
                    pb.style.width = "100%";
                } else if (sessionStatus === "error") {
                    color = "red";
                    pb.style.width = "100%";
                } else {
                    pb.style.width = (session.progress ?? 0) + "%";
                }

                pb.style.background = color;
                pbc.appendChild(pb);
                sdiv.appendChild(pbc);

                /* Tasks */
                const ul = document.createElement("ul");
                ul.className = "task-list";

                let scrollTarget = null;

                tasks.forEach(t => {
                    const li = document.createElement("li");
                    li.textContent = `${t.id} ${t.name} (${t.status}) ${t.extra || ""}`;

                    if (t.status === "running") {
                        li.className = "task-running";
                        scrollTarget = li;
                    } else if (t.status === "waiting") {
                        li.className = "task-waiting";
                        if (!scrollTarget) scrollTarget = li;
                    } else if (t.status === "error") {
                        li.className = "task-error";
                    } else {
                        li.className = "task-finished";
                    }

                    ul.appendChild(li);
                });

                sdiv.appendChild(ul);
                card.appendChild(sdiv);

                /* Scroll only inside task list */
                if (scrollTarget) {
                    const ulRect = ul.getBoundingClientRect();
                    const liRect = scrollTarget.getBoundingClientRect();
                    ul.scrollTop += (liRect.top - ulRect.top) - ul.clientHeight / 2;
                }
            });

            container.appendChild(card);
        }

        const upd = document.createElement("div");
        upd.style.fontSize = "0.8em";
        upd.style.color = "#aaaaaa";
        upd.style.marginTop = "10px";
        upd.textContent =
            "Status updated: " + new Date(data.updated).toLocaleString();
        container.appendChild(upd);

    } catch (err) {
        container.innerHTML =
            "<p style='color:red'>Unable to load status.</p>";
        console.error(err);
    }
}

updateMonitor();
</script>

</body>
</html>
